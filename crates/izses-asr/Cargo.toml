[package]
name = "izses-asr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
izses-core = { path = "../izses-core" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true

candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
rand = "0.9"
byteorder = "1"

[dev-dependencies]
tempfile.workspace = true
izses-audio = { path = "../izses-audio" }

[features]
default = []
# GPU hızlandırma. Yalnızca gerçek donanımda doğrulandığında etkinleştirilir.
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
