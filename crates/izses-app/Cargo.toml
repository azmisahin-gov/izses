[package]
name = "izses-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "izses"
path = "src/main.rs"

[dependencies]
izses-core = { path = "../izses-core" }
izses-audio = { path = "../izses-audio" }
izses-asr = { path = "../izses-asr" }
izses-report = { path = "../izses-report" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
hex.workspace = true
walkdir.workspace = true
zip = { version = "2.2.3", default-features = false, features = ["deflate"] }
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts", "glow", "x11", "wayland", "persistence",
] }
egui = "0.32"
rfd = "0.15"

# Ses oynatma yalnızca Windows hedefinde derlenir. Geliştirme ortamında
# (Linux) ses aygıtı katmanı olmadan da uygulama derlenir ve çalışır;
# oynatma düğmeleri bu durumda açık bir uyarı gösterir.
[target.'cfg(windows)'.dependencies]
rodio = { version = "0.20", default-features = false, features = [
    "symphonia-all", "wav", "mp3", "flac", "vorbis", "symphonia-isomp4",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile.workspace = true
hound = "3.5"
